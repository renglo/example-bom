name: Deploy Console (Amplify)

on:
  push:
    branches:
      - main
    paths:
      - "deploy_targets.yml"
      - "bom/**"
      - ".github/workflows/deploy_console.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: console-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_matrix:
    name: Prepare tenant matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build_bom: ${{ steps.set-matrix.outputs.build_bom }}

    steps:
      - name: Checkout BOM repo
        uses: actions/checkout@v4

      - name: Setup bom-helper
        uses: renglo/bom-helper/.github/actions/use-helper@main


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build matrix JSON
        id: set-matrix
        run: |
          set -euo pipefail
          MATRIX="$(python scripts/render_deploy_matrix.py deploy_targets.yml --pipeline console)"
          BUILD_BOM="$(python scripts/render_deploy_matrix.py deploy_targets.yml --build-bom)"
          python scripts/bom_manifest.py --validate --pipeline console "bom/v${BUILD_BOM}.json"
          {
            echo 'matrix<<MATRIX_EOF'
            echo "$MATRIX"
            echo 'MATRIX_EOF'
            echo "build_bom=${BUILD_BOM}"
          } >> "$GITHUB_OUTPUT"

  deploy_console:
    name: Deploy console ${{ matrix.tenant }} (${{ matrix.stage }})
    runs-on: ubuntu-latest
    needs: prepare_matrix
    if: ${{ needs.prepare_matrix.outputs.matrix != '{"include":[]}' }}
    environment: ${{ matrix.stage }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare_matrix.outputs.matrix) }}
    concurrency:
      group: console-deploy-${{ matrix.tenant }}-${{ matrix.stage }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout BOM repo
        uses: actions/checkout@v4

      - name: Setup bom-helper
        uses: renglo/bom-helper/.github/actions/use-helper@main


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.oidc_role_arn }}
          aws-region: ${{ matrix.aws_region }}

      - name: Checkout BOM repos
        id: repos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/checkout_bom.py \
            "bom/v${{ needs.prepare_matrix.outputs.build_bom }}.json" \
            --pipeline console

      - name: Setup Node.js
        if: ${{ hashFiles('console/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Setup Node.js (no lockfile yet)
        if: ${{ hashFiles('console/package-lock.json') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Login to CodeArtifact
        if: ${{ steps.repos.outputs.has_npm_pins == 'true' || steps.repos.outputs.has_console_pin == 'true' }}
        env:
          CODEARTIFACT_DOMAIN: ${{ vars.CODEARTIFACT_DOMAIN }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
        run: |
          set -euo pipefail
          REGISTRY="$(python scripts/render_deploy_matrix.py deploy_targets.yml --registry)"
          DOMAIN="${CODEARTIFACT_DOMAIN:-$(echo "$REGISTRY" | jq -r '.domain')}"
          OWNER="${CODEARTIFACT_DOMAIN_OWNER:-$(echo "$REGISTRY" | jq -r '.domain_owner')}"
          NPM_REPO="$(echo "$REGISTRY" | jq -r '.npm_repository')"
          CA_REGION="$(echo "$REGISTRY" | jq -r '.region')"
          aws codeartifact login --tool npm \
            --domain "${DOMAIN}" \
            --domain-owner "${OWNER}" \
            --repository "${NPM_REPO}" \
            --region "${CA_REGION}"

      - name: Materialize console host
        if: ${{ steps.repos.outputs.has_console_pin == 'true' }}
        run: |
          python scripts/materialize_console.py \
            "bom/v${{ needs.prepare_matrix.outputs.build_bom }}.json"

      - name: Fetch console config from SSM
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/fetch_deploy_input.py \
            --parameter "${{ matrix.ssm_parameter }}" \
            --region "${{ matrix.aws_region }}" \
            --output deploy_input.json \
            --merge-secret OPENAI_API_KEY
          BASE_URL="$(jq -r '.VARS.BASE_URL // empty' deploy_input.json)"
          COGNITO_REGION="$(jq -r '.VARS.COGNITO_REGION // empty' deploy_input.json)"
          COGNITO_USERPOOL_ID="$(jq -r '.VARS.COGNITO_USERPOOL_ID // empty' deploy_input.json)"
          COGNITO_APP_CLIENT_ID="$(jq -r '.VARS.COGNITO_APP_CLIENT_ID // empty' deploy_input.json)"
          WEBSOCKET_URL="$(jq -r '.VARS.WEBSOCKET_URL // .VARS.VITE_WEBSOCKET_URL // empty' deploy_input.json)"
          AMPLIFY_APP_ID="$(jq -r '.VARS.AMPLIFY_APP_ID // empty' deploy_input.json)"
          {
            echo "VITE_API_URL=${BASE_URL}"
            echo "VITE_COGNITO_REGION=${COGNITO_REGION}"
            echo "VITE_COGNITO_USERPOOL_ID=${COGNITO_USERPOOL_ID}"
            echo "VITE_COGNITO_APP_CLIENT_ID=${COGNITO_APP_CLIENT_ID}"
            echo "VITE_WEBSOCKET_URL=${WEBSOCKET_URL}"
            echo "VITE_EXTENSIONS=${{ steps.repos.outputs.vite_extensions }}"
            echo "VITE_DEV_MODE=false"
            echo "AMPLIFY_APP_ID=${AMPLIFY_APP_ID}"
          } >> "$GITHUB_ENV"

      - name: Build console
        working-directory: console
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "console/ is missing package.json. Clone renglo/console or pin @renglo/console." >&2
            exit 1
          fi
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
          if [[ "${{ steps.repos.outputs.has_npm_pins }}" == "true" ]]; then
            # shellcheck disable=SC2086
            npm install ${{ steps.repos.outputs.npm_specs }}
          fi
          if [[ "${{ steps.repos.outputs.has_npm_local }}" == "true" ]]; then
            # shellcheck disable=SC2086
            npm install ${{ steps.repos.outputs.npm_local_specs }}
          fi
          npm run build

      - name: Deploy to Amplify
        run: |
          set -euo pipefail
          if [[ -z "${AMPLIFY_APP_ID}" ]]; then
            echo "Missing VARS.AMPLIFY_APP_ID in SSM deploy-input." >&2
            exit 1
          fi
          chmod +x scripts/deploy_amplify_console.sh
          scripts/deploy_amplify_console.sh "${AMPLIFY_APP_ID}" "${{ matrix.stage }}" console/dist
